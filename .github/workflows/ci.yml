name: ci

on:
  push:
    branches: [master, main]
  pull_request:

# ⛔ This workflow performs NO oracle I/O. It never calls an ephemeris service, never
#    downloads a kernel and never runs a generator. Generators are run deliberately, by a
#    person, against a file whose digest is checked — a fixture produced by a scheduled job
#    nobody read is not evidence.

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the contract's own dependencies only
        # ⭐ Not requirements.txt. The fixture contract has no third-party dependency, and
        #    installing the ephemeris libraries here would mean CI could not tell the
        #    difference between "the schema is sound" and "the oracles are installed".
        #
        # ⚠ `tzdata` is the one exception, and it is a data package rather than an oracle:
        #    without it the civil-resolution tests are unrunnable wherever the platform has
        #    no system timezone database, so the suite would pass or fail by operating
        #    system. ⛔ It does NOT pin the answer here — `zoneinfo` searches the system path
        #    first and this runner has one, so the packaged rules are a fallback that a
        #    Linux runner never reaches. That asymmetry is measured, not assumed, and it is
        #    the reason a resolved offset is written into a row instead of a zone name.
        run: python -m pip install pytest==8.4.2 tzdata==2024.2

      - name: The fixture contract refuses what it must
        # ⭐ The declaration is checked, not assumed. `absent` says this environment has no
        #    ephemeris library, so the oracle half of the suite is skipped — and the suite
        #    refuses to run if that is ever untrue, which is what stops a later `pip install`
        #    from quietly changing what a green badge here means.
        env:
          ORACLE_LIBRARIES: absent
        run: python -m pytest -q -rs

      - name: The leak check's matcher is alive
        # ⭐ Runs WITHOUT a reserved-name list, and that is the point: the names are
        #    private, the matcher is not, and it was the matcher that was silently dead.
        #    A pattern that matches nothing makes the whole check green over an empty set.
        run: python tools/check_public_tree.py --self-test

      - name: The contract is fail-closed with no local configuration
        # ⚠ CI has no config/reserved-names.txt, so only the built-in default applies.
        #    This asserts the tooling SAYS SO rather than reporting a full check.
        run: |
          python - <<'PY'
          import sys; sys.path.insert(0, "src")
          from saakshi.fixture import describe_reserved_names, reserved_names
          text = describe_reserved_names()
          print(text)
          assert reserved_names(), "the reserved-name list must never be empty"
          assert "absent" in text, (
              "with no local list, the tooling must say the check is reduced"
          )
          PY
